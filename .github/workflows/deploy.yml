name: Deploy to Xserver

# 手動実行のみ。
#
# juku-map.jp を実際に配信しているのは WordPress で、このリポジトリの
# Laravel アプリではない（DNSの向き先も、Laravelを置いている Xserver とは
# 別のサーバになっている）。それなのに push のたびに本番サーバへ
# rsync --delete と public_html の作り直しが走るのは危ない。
#
# 動かすときは Actions の画面から手で実行する。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          extensions: sqlite3, pdo_sqlite

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend assets
        run: |
          npm install
          npm run build

      - name: Write production .env
        run: |
          cat > .env <<EOF
          APP_NAME="学習塾マップ"
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=https://juku-map.jp
          APP_LOCALE=ja
          APP_FALLBACK_LOCALE=ja
          DB_CONNECTION=sqlite
          LOG_CHANNEL=stack
          LOG_LEVEL=error
          CACHE_STORE=file
          SESSION_DRIVER=file
          QUEUE_CONNECTION=sync
          GA_MEASUREMENT_ID=G-P4QF8RP681
          GOOGLE_SITE_VERIFICATION=LxeT7qSUXM5ZrB1Pkz_a0RgqP03pxgTtwpqz3_gXyOI
          EOF

      - name: Deploy app via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude=".git" --exclude=".github" --exclude="node_modules" --exclude="tests" --exclude="database/database.sqlite" --exclude="storage/app" --exclude="storage/logs" --exclude="storage/framework"
          path: ./
          remote_path: /home/xs501620/juku-map.jp/app/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: '10022'
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Link public_html, run migrations, cache config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/xs501620/juku-map.jp
            mkdir -p app/database app/storage/framework/cache app/storage/framework/sessions app/storage/framework/views app/storage/logs app/storage/app
            touch app/database/database.sqlite
            chmod -R 775 app/storage app/database
            # public_html が実体のディレクトリだった場合、以前はここで
            # rm -rf していた。中に別のサイト（WordPress など）が入っていたら
            # 丸ごと消えてしまうので、消さずに中断する。
            if [ -e public_html ] && [ ! -L public_html ]; then
              echo "public_html がシンボリックリンクではありません。中身を消す恐れがあるため中断します。" >&2
              ls -la public_html | head -20 >&2
              exit 1
            fi

            if [ ! -L public_html ] || [ "$(readlink -f public_html)" != "$(readlink -f app/public)" ]; then
              rm -f public_html
              ln -s app/public public_html
            fi
            cd app
            /opt/php-8.3.30/bin/php artisan migrate --force
            /opt/php-8.3.30/bin/php artisan db:seed --force 2>&1 || echo "Seeder warning (non-fatal)"
            /opt/php-8.3.30/bin/php artisan config:cache
            /opt/php-8.3.30/bin/php artisan route:cache
            /opt/php-8.3.30/bin/php artisan view:cache

      - name: Notify IndexNow
        run: |
          curl -fsS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"juku-map.jp","key":"jukumap2026","keyLocation":"https://juku-map.jp/jukumap2026.txt","urlList":["https://juku-map.jp/"]}' || true
          echo "IndexNow notified"
