name: Deploy to Xserver

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xserver-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PORT: '10022'
      GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      SSH_HOST_KEY_SHA256: ${{ vars.SSH_HOST_KEY_SHA256 }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Build
        run: npm run build

      - name: Validate deployment settings and routing
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          [[ "$GA_MEASUREMENT_ID" =~ ^G-[A-Z0-9]+$ ]] || {
            echo "::error::GA_MEASUREMENT_ID must be a valid GA4 measurement ID."
            exit 1
          }
          if [[ -n "$GOOGLE_SITE_VERIFICATION" ]] &&
             [[ ! "$GOOGLE_SITE_VERIFICATION" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::GOOGLE_SITE_VERIFICATION contains unsupported characters."
            exit 1
          fi
          [[ "$SSH_HOST_KEY_SHA256" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || {
            echo "::error::SSH_HOST_KEY_SHA256 must contain the verified SSH host fingerprint."
            exit 1
          }

          domain_ips="$(getent ahostsv4 juku-map.jp | awk '{print $1}' | sort -u)"
          ssh_ips="$(getent ahostsv4 "$SSH_HOST" | awk '{print $1}' | sort -u)"
          if [[ -z "$domain_ips" || -z "$ssh_ips" || "$domain_ips" != "$ssh_ips" ]]; then
            echo "::error::juku-map.jp does not resolve to the configured SSH_HOST."
            exit 1
          fi

      - name: Package application
        shell: bash
        run: |
          tar \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='storage' \
            --exclude='tests' \
            -czf "$RUNNER_TEMP/release.tar.gz" .

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -t ecdsa "$SSH_HOST" > ~/.ssh/scanned_host_key
          scanned_fingerprint="$(
            ssh-keygen -lf ~/.ssh/scanned_host_key -E sha256 |
            awk 'NR == 1 { print $2 }'
          )"
          if [[ "$scanned_fingerprint" != "$SSH_HOST_KEY_SHA256" ]]; then
            echo "::error::The Xserver SSH host key does not match the pinned fingerprint."
            exit 1
          fi
          mv ~/.ssh/scanned_host_key ~/.ssh/known_hosts

      - name: Upload release without deleting remote files
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          SSH_TARGET="$SSH_USERNAME@$SSH_HOST"
          SSH_ARGS=(-i ~/.ssh/deploy_key -p "$SSH_PORT")
          ssh "${SSH_ARGS[@]}" "$SSH_TARGET" 'mkdir -p juku-map-app/uploads'
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            "$RUNNER_TEMP/release.tar.gz" \
            "$SSH_TARGET:juku-map-app/uploads/release-$GITHUB_SHA.tar.gz"

      - name: Activate release
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          SSH_TARGET="$SSH_USERNAME@$SSH_HOST"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_TARGET" \
            "bash -s -- '$GITHUB_SHA' '$GA_MEASUREMENT_ID' '$GOOGLE_SITE_VERIFICATION'" \
            < .github/scripts/deploy-xserver.sh

      - name: Verify public site
        shell: bash
        run: |
          for attempt in {1..6}; do
            response="$(curl --fail --silent --show-error https://juku-map.jp/)" || true
            if grep -Fq "gtag/js?id=$GA_MEASUREMENT_ID" <<< "$response"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::The public site did not return the deployed GA4 tag."
          exit 1
