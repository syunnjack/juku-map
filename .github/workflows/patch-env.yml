name: One-off env patch (GA4 + Search Console)

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Update GA_MEASUREMENT_ID / GOOGLE_SITE_VERIFICATION in production .env
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/xs501620/juku-map.jp
            test -f .env
            cp .env .env.bak.$(date +%Y%m%d%H%M%S)
            grep -q '^GA_MEASUREMENT_ID=' .env \
              && sed -i 's/^GA_MEASUREMENT_ID=.*/GA_MEASUREMENT_ID=G-P4QF8RP681/' .env \
              || echo 'GA_MEASUREMENT_ID=G-P4QF8RP681' >> .env
            grep -q '^GOOGLE_SITE_VERIFICATION=' .env \
              && sed -i 's/^GOOGLE_SITE_VERIFICATION=.*/GOOGLE_SITE_VERIFICATION=LxeT7qSUXM5ZrB1Pkz_a0RgqP03pxgTtwpqz3_gXyOI/' .env \
              || echo 'GOOGLE_SITE_VERIFICATION=LxeT7qSUXM5ZrB1Pkz_a0RgqP03pxgTtwpqz3_gXyOI' >> .env
            /usr/bin/php8.3 artisan config:clear || echo "config:clear skipped (artisan not found here)"
            echo "Done."

  inspect:
    runs-on: ubuntu-latest
    needs: patch
    if: always()
    steps:
      - name: Inspect live server state (no secrets printed)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/xs501620/juku-map.jp
            echo "--- .env GA/GSC lines ---"
            grep -E '^GA_MEASUREMENT_ID=|^GOOGLE_SITE_VERIFICATION=' .env || echo "not set"
            echo "--- find artisan ---"
            find . -maxdepth 2 -iname "artisan" 2>/dev/null || echo "artisan not found within 2 levels"
            echo "--- blade layout files on server ---"
            find . -path ./vendor -prune -o -iname "*.blade.php" -print 2>/dev/null
            echo "--- grep gtag/GA in blade files ---"
            grep -rl "gtag\|G-" --include="*.blade.php" resources/views 2>/dev/null || echo "no matches"
            echo "--- search home dir for artisan (excluding vendor) ---"
            find /home/xs501620 -maxdepth 4 -iname "artisan" -not -path "*/vendor/*" 2>/dev/null || true
            echo "--- list /home/xs501620 top level ---"
            ls -la /home/xs501620 2>/dev/null || true
            echo "--- search for G-E6MZY93T3L on disk ---"
            grep -rl "G-E6MZY93T3L" /home/xs501620 --include="*.php" --include="*.env" -I 2>/dev/null | head -20 || echo "no matches"

  inspect-app-dir:
    runs-on: ubuntu-latest
    needs: inspect
    if: always()
    steps:
      - name: Inspect juku-map-app (Deployer-style) structure
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/xs501620/juku-map-app
            echo "--- top level ---"
            ls -la .
            echo "--- current -> ? ---"
            readlink -f current 2>/dev/null || echo "no 'current' symlink"
            echo "--- shared dir ---"
            ls -la shared 2>/dev/null || echo "no shared dir"
            echo "--- shared/.env GA lines (if present) ---"
            grep -E '^GA_MEASUREMENT_ID=|^GOOGLE_SITE_VERIFICATION=' shared/.env 2>/dev/null || echo "no shared/.env or no matching lines"
            echo "--- current/.env GA lines (if present, may just be a symlink to shared) ---"
            grep -E '^GA_MEASUREMENT_ID=|^GOOGLE_SITE_VERIFICATION=' current/.env 2>/dev/null || echo "no current/.env or no matching lines"
